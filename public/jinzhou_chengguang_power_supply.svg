<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#001845" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEEEEE" />
      <stop offset="50%" stop-color="#B0B0B0" />
      <stop offset="100%" stop-color="#7C7C7C" />
    </linearGradient>

    <clipPath id="innerJClip">
      <path d="M 52,8 L 114,8 L 114,118 C 114,147 95,162 68,162 C 39,162 18,145 18,116 L 48,116 C 48,129 56,138 68,138 C 80,138 86,131 86,119 L 86,35 L 52,35 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(10, 9)">
    <!-- metallic outer J -->
    <path d="M 44,0 L 126,0 L 126,120 C 126,157 102,174 68,174 C 31,174 6,153 6,110 L 38,110 C 38,130 49,142 67,142 C 83,142 94,131 94,118 L 94,28 L 44,28 Z" fill="url(#metalGrad)"/>

    <!-- inner J fill clipped -->
    <g clip-path="url(#innerJClip)">
      <rect x="12" y="8" width="110" height="154" fill="url(#redGrad)"/>
      <rect x="52" y="8" width="36" height="154" fill="url(#blueGrad)"/>

      <!-- subtle gloss lines on red area -->
      <path d="M 69,116 Q 82,131 80,162" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.22"/>
      <path d="M 88,95 Q 105,121 104,162" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.22"/>
      <path d="M 22,150 Q 45,140 68,142" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.18"/>
    </g>

    <!-- white circuit on blue stem -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8" opacity="0.92">
      <line x1="61" y1="22" x2="71" y2="33" />
      <line x1="71" y1="33" x2="68" y2="53" />
      <line x1="68" y1="53" x2="78" y2="72" />
      <line x1="78" y1="72" x2="63" y2="96" />
      <line x1="63" y1="96" x2="73" y2="118" />
      <line x1="73" y1="118" x2="61" y2="132" />

      <circle cx="61" cy="22" r="2.6" />
      <circle cx="71" cy="33" r="2.2" />
      <circle cx="68" cy="53" r="2.2" />
      <circle cx="78" cy="72" r="2.8" />
      <circle cx="63" cy="96" r="2.2" />
      <circle cx="73" cy="118" r="2.2" />
      <circle cx="61" cy="132" r="3.0" />
    </g>
  </g>

  <text x="195" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#002D62" letter-spacing="0.8">JINZHOU CHENGGUANG</text>
  <text x="198" y="138" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0A2540" letter-spacing="2.5">POWER SUPPLY</text>
</svg>
